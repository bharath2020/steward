      on_exhaustion: fail
  report:
    agent: codex
    title: Summarize committed platform evidence
    needs:
      - rocket55_ios_test
      - rocket55_android_test
      - rocket56_ios_test
      - rocket56_android_test
      - expo54_ios_test
      - expo54_android_test
      - expo54_web_test
    inputs:
      rocket55_ios_test: $nodes.rocket55_ios_test.output
      rocket55_android_test: $nodes.rocket55_android_test.output
      rocket56_ios_test: $nodes.rocket56_ios_test.output
      rocket56_android_test: $nodes.rocket56_android_test.output
      expo54_ios_test: $nodes.expo54_ios_test.output
      expo54_android_test: $nodes.expo54_android_test.output
      expo54_web_test: $nodes.expo54_web_test.output
    prompt: Summarize only the supplied committed test results. Return passed true
      only if every platform passed with real evidence. List evidence paths. Do
      not claim durability or restart recovery was tested from build/test
      results alone; that needs independent Temporal history and artifact
      comparison from the operator checklist.
    outputs:
      passed: boolean
      summary: string
      evidence_paths: string[]
      durability_verified: boolean
