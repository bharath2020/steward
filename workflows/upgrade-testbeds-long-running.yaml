version: 1
name: upgrade-testbeds-long-running
description: Real TypeScript -> per-platform build -> per-platform test across
  three testbeds. Start with upgrade-testbeds as the required working directory;
  report missing build and device prerequisites as blocked.
defaults:
  provider: codex
  max_parallelism: 3
  retry:
    maximum_attempts: 2
groups:
  ios:
    title: Shared iOS simulator/build lane
    max_parallelism: 1
  android:
    title: Shared Android emulator/build lane
    max_parallelism: 1
  web:
    title: Web lane
    max_parallelism: 1
nodes:
  rocket55_typescript:
    title: "rocket55: all typescript"
    agent: codex
    inputs:
      target: $input.targets.rocket55
      phase: typescript
      platform: all
    prompt_file: prompts/upgrade-testbeds-gate.md
    outputs: &a1
      passed: boolean
      status: string
      repository: string
      revision: string
      phase: string
      platform: string
      commands: string[]
      exit_codes: number[]
      started_at: string
      finished_at: string
      evidence: object[]
      blockers: string[]
    loop:
      max_iterations: 1
      until:
        path: passed
        operator: equals
        value: true
      on_exhaustion: fail
  rocket55_ios_build:
    title: "rocket55: ios build"
    agent: codex
    group: ios
    needs:
      - rocket55_typescript
    inputs:
      target: $input.targets.rocket55
      phase: build
      platform: ios
      predecessor: $nodes.rocket55_typescript.output
    prompt_file: prompts/upgrade-testbeds-gate.md
    outputs: *a1
    loop:
      max_iterations: 1
      until:
        path: passed
        operator: equals
        value: true
      on_exhaustion: fail
  rocket55_ios_test:
    title: "rocket55: ios test"
    agent: codex
    group: ios
    needs:
      - rocket55_ios_build
    inputs:
      target: $input.targets.rocket55
      phase: test
      platform: ios
      predecessor: $nodes.rocket55_ios_build.output
    prompt_file: prompts/upgrade-testbeds-gate.md
    outputs: *a1
    loop:
      max_iterations: 1
      until:
        path: passed
        operator: equals
        value: true
      on_exhaustion: fail
  rocket55_android_build:
    title: "rocket55: android build"
    agent: codex
    group: android
    needs:
      - rocket55_typescript
    inputs:
      target: $input.targets.rocket55
      phase: build
      platform: android
      predecessor: $nodes.rocket55_typescript.output
    prompt_file: prompts/upgrade-testbeds-gate.md
    outputs: *a1
    loop:
      max_iterations: 1
      until:
        path: passed
        operator: equals
        value: true
      on_exhaustion: fail
  rocket55_android_test:
    title: "rocket55: android test"
    agent: codex
    group: android
    needs:
      - rocket55_android_build
    inputs:
      target: $input.targets.rocket55
      phase: test
      platform: android
      predecessor: $nodes.rocket55_android_build.output
    prompt_file: prompts/upgrade-testbeds-gate.md
    outputs: *a1
    loop:
      max_iterations: 1
      until:
        path: passed
        operator: equals
        value: true
      on_exhaustion: fail
  rocket56_typescript:
    title: "rocket56: all typescript"
    agent: codex
    inputs:
      target: $input.targets.rocket56
      phase: typescript
      platform: all
    prompt_file: prompts/upgrade-testbeds-gate.md
