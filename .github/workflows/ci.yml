name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-macos-setup:
    name: Fresh macOS setup from GitHub
    runs-on: macos-14
    timeout-minutes: 20
    env:
      STEWARD_ISOLATED_SETUP_TEST: '1'
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Verify clean checkout and record host prerequisites
        run: |
          test ! -e node_modules
          test ! -e runtime
          sw_vers
          git rev-parse HEAD
          command -v node || true
          command -v brew || true
          if command -v temporal; then
            echo "Expected a runner without Temporal so setup exercises its installation."
            exit 1
          fi
      - name: Install and launch from the repository command
        run: bash scripts/setup.sh --example file --no-open
      - name: Verify Temporal completion, committed output, and repeat setup
        run: node --import tsx scripts/verify-installed-setup.cjs
      - name: Run repository verification
        run: npm run verify
      - name: Upload setup evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: isolated-macos-setup-${{ github.sha }}
          path: |
            output/isolated-setup-verdict.json
            runtime/services/*.log
            runtime/services/setup-start.json
            runtime/runs/
          if-no-files-found: warn
          retention-days: 7

  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck and test
        run: npm run verify

  recovery:
    name: Simulated recovery (Node 24)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Temporal CLI 1.8.2
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            --output temporal_cli_1.8.2_linux_amd64.tar.gz \
            https://github.com/temporalio/cli/releases/download/v1.8.2/temporal_cli_1.8.2_linux_amd64.tar.gz
          printf '%s\n' 'd8421bda989e6514b4bdb4d63a9012a8a05a806892e881a5aad8510496349a94  temporal_cli_1.8.2_linux_amd64.tar.gz' | sha256sum --check --strict
          mkdir -p temporal-bin
          tar -xzf temporal_cli_1.8.2_linux_amd64.tar.gz -C temporal-bin temporal
          echo "$RUNNER_TEMP/temporal-bin" >> "$GITHUB_PATH"
      - name: Verify installed Temporal version
        run: temporal --version
      - name: Verify worker-loss and session recovery
        # The harness owns its temp directory, server ports, and simulated runs.
        # It does not need Codex credentials or the repository runtime directory.
        run: npm run verify:recovery
